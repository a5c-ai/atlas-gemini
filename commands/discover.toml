description = "Interactive systems discovery — turn a stated need into a full system design via the Atlas graph."

prompt = "Invoke the babysitter:babysit skill (using the Skill tool) and follow its instructions (SKILL.md). Run the PRE-AUTHORED atlas process bundled with this plugin — do NOT interview the user or author a new process. Create the run directly from this bundled entry and iterate it to completion:\n\n```\n${GEMINI_EXTENSION_PATH}/processes/atlas-systems-discovery.mjs#process\n```\n\n(e.g. `babysitter run:create --process-id atlas-systems-discovery --entry \"${GEMINI_EXTENSION_PATH}/processes/atlas-systems-discovery.mjs#process\" --harness <this-harness>`, then iterate.) Pass the user arguments below as the run's stated need / process inputs. Continue executing in this same turn; do not stop after the Skill tool returns. Use the atlas skill and the Atlas MCP tools (mcp__atlas__atlas_public_*) for all graph queries.\n\nUser arguments for this command:\n\n$ARGUMENTS"
